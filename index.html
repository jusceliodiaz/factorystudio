    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --gold: #b89c6e;
        --bg: #080808;
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.4);
        --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }

      .hero-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .hero-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transform: scale(1.06);
        transition:
          opacity 1.5s ease,
          transform 9s ease;
      }

      .hero-slide.active {
        opacity: 1;
        transform: scale(1);
      }

      .hero-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.92),
          rgba(0, 0, 0, 0.55)
        );
      }

      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px;
        position: relative;
        z-index: 1;
        transform: scale(1.3);
        transform-origin: center center;
      }

      /* subtle radial glow */
      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 60% 50% at 50% 50%,
          rgba(184, 156, 110, 0.07),
          transparent 70%
        );
        pointer-events: none;
      }

      .logo {
        height: 80px;
        width: auto;
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeUp 0.9s var(--ease) 0.2s forwards;
      }

      .label {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeUp 0.9s var(--ease) 0.4s forwards;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeUp 0.9s var(--ease) 0.55s forwards;
      }

      h1 span {
        color: var(--gold);
      }

      .sub {
        font-size: clamp(0.9rem, 2vw, 1.05rem);
        font-weight: 400;
        color: var(--muted);
        max-width: 580px;
        line-height: 1.65;
        margin-bottom: 52px;
        opacity: 0;
        animation: fadeUp 0.9s var(--ease) 0.7s forwards;
      }

      .divider {
        width: 48px;
        height: 1px;
        background: var(--gold);
        opacity: 0;
        animation: fadeUp 0.9s var(--ease) 0.85s forwards;
      }

      /* admin button — discreto, canto inferior direito */
      .btn-wa {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 24px 10px 10px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: 36px;
        scale: 0.8;
        opacity: 0;
        animation: fadeUp 0.8s var(--ease) 1s forwards;
        transition:
          transform 0.25s var(--ease),
          border-color 0.25s;
      }

      .btn-wa:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.35);
      }

      .btn-wa-icon {
        width: 48px;
        height: 48px;
        background: var(--gold);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        flex-shrink: 0;
        transition: transform 0.25s var(--ease);
      }

      .btn-wa:hover .btn-wa-icon {
        transform: rotate(12deg) scale(1.12);
      }

      /* admin button — discreto, canto inferior direito */
      .btn-admin {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 2;
        font-family: "Inter", sans-serif;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: transparent;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          color 0.25s,
          border-color 0.25s;
        opacity: 0;
        animation: fadeUp 0.6s var(--ease) 1.2s forwards;
      }

      .btn-admin:hover {
        color: rgba(255, 255, 255, 0.55);
        border-color: rgba(255, 255, 255, 0.22);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .logo {
          height: 60px;
          margin-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero-bg">

      <div

      <div class="divider"></div>
      <a

            />
          </svg>
        </span>
        Fale conosco
      </a>
    </div>

    <a href="/site.html" class="btn-admin">admin</a>
    <script>
      const slides = document.querySelectorAll(".hero-slide");
      let cur = 0;
      setInterval(() => {
        slides[cur].classList.remove("active");
        cur = (cur + 1) % slides.length;
        slides[cur].classList.add("active");
      }, 5000);
    </script>
  </body>
</html>
