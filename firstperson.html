<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Maquete interativa</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3K51DFTX3J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-3K51DFTX3J");
    </script>
    <!-- Preload do poster e do primeiro vídeo -->
    <link
      rel="preload"
      href="images/seq_arch/aereo_to_piscina_00.jpg"
      as="image"
    />
    <link rel="preload" href="images/1.webm" as="video" type="video/webm" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      #btn-back {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: 20px;
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: rgba(255,255,255,0.85);
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
      }
      #btn-back:hover {
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.35);
        transform: translateX(-2px);
      }
      #btn-back svg {
        flex-shrink: 0;
        opacity: 0.75;
      }
      .lang-switcher {
        position: fixed;
        top: 28px;
        right: 32px;
        z-index: 200;
        display: flex;
        gap: 16px;
      }
      .lang-btn {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        padding: 2px 0 4px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: rgba(255,255,255,0.35);
        transition: color 0.2s ease, border-color 0.2s ease;
      }
      .lang-btn.active { color: #fff; border-bottom-color: #c8a96e; }
      .lang-btn:hover:not(.active) { color: rgba(255,255,255,0.65); }
    </style>
  </head>
  <body>
    <div class="lang-switcher" role="group" aria-label="Selecionar idioma">
      <button class="lang-btn active" data-lang="pt" title="Português">PT</button>
      <button class="lang-btn" data-lang="en" title="English">EN</button>
    </div>
    <a id="btn-back" href="fi-preview.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      <span data-i18n="back">Voltar</span>
    </a>

    <div id="cursor"></div>
    <div id="ring"></div>
    <div id="noise"></div>

    <div id="stage">
      <video id="main-video" muted loop playsinline preload="auto"></video>
      <canvas id="seq-canvas"></canvas>
      <div id="poi-layer"></div>
    </div>

    <div id="scene-tag"></div>
    <div id="track"></div>

    <div id="loader"><span></span><span></span><span></span></div>

    <div id="debug-hud" hidden>
      <span id="debug-mode">DEBUG ON — clique para coordenadas</span>
      <span id="debug-coords">—</span>
    </div>

    <script src="scenes.js"></script>
    <script src="script.js"></script>
    <script>
      (function () {
        var T = { pt: { "back": "Voltar" }, en: { "back": "Back" } };
        function applyLang(lang) {
          var dict = T[lang]; if (!dict) return;
          document.querySelectorAll("[data-i18n]").forEach(function (el) {
            var key = el.getAttribute("data-i18n");
            var val = dict[key]; if (val === undefined) return;
            el.textContent = val;
          });
          document.documentElement.lang = lang === "en" ? "en-US" : "pt-BR";
          localStorage.setItem("fi-lang", lang);
        }
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var lang = btn.getAttribute("data-lang");
            document.querySelectorAll(".lang-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
            applyLang(lang);
          });
        });
        var saved = localStorage.getItem("fi-lang");
        if (saved && T[saved] && saved !== "pt") applyLang(saved);
      })();
    </script>
  </body>
</html>
