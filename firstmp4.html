<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maquete interativa</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3K51DFTX3J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-3K51DFTX3J");
    </script>
    <link rel="preload" href="images/seq_arch/aereo_to_piscina_00.jpg" as="image" />
    <link rel="preload" href="images/1.mp4" as="video" type="video/mp4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* ── Voltar ── */
      #btn-back {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: 20px;
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: rgba(255,255,255,0.85);
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
      }
      #btn-back:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); transform: translateX(-2px); }
      #btn-back svg { flex-shrink: 0; opacity: 0.75; }

      /* ── Footer ── */
      #fp-footer {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        padding: 12px 22px;
        background: rgba(0,0,0,0.52);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 999px;
        white-space: nowrap;
        pointer-events: none;
      }
      #fp-footer p {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 400;
        color: rgba(255,255,255,0.55);
        letter-spacing: 0.01em;
        line-height: 1;
      }

      /* ── CTA dock ── */
      #cta-dock {
        position: fixed;
        z-index: 30;
        right: 16px;
        bottom: max(96px, calc(env(safe-area-inset-bottom, 16px) + 80px));
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
      }
      #cta-whats, #cta-visit, #cta-tour {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0,0,0,.28);
        transition: transform .15s ease, opacity .15s ease;
        white-space: nowrap;
      }
      #cta-whats { background: #25D366; color: #fff; text-decoration: none; }
      #cta-visit { background: #c8a96e; color: #1a1408; }
      #cta-tour  { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(12px); }
      #cta-whats:active, #cta-visit:active, #cta-tour:active { transform: scale(.96); }
      body.touring #cta-dock { opacity: 0.4; }

      /* ── Lead modal ── */
      #lead-modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5,5,3,.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      #lead-modal[hidden] { display: none; }
      #lead-card {
        position: relative;
        width: min(360px, 88vw);
        background: #14130f;
        color: #f3efe6;
        border-radius: 18px;
        padding: 28px 24px;
        border: 1px solid rgba(255,255,255,.12);
        font-family: 'DM Sans', sans-serif;
      }
      #lead-card h3 { font-size: 20px; margin-bottom: 6px; }
      #lead-card > p { font-size: 13px; opacity: .7; margin-bottom: 18px; }
      #lead-form { display: flex; flex-direction: column; gap: 10px; }
      #lead-form input {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.15);
        background: rgba(255,255,255,.05);
        color: #fff;
        font-family: 'DM Sans', sans-serif;
        font-size: 16px;
      }
      #lead-form input::placeholder { color: rgba(255,255,255,0.35); }
      #lead-form button {
        margin-top: 6px;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #c8a96e;
        color: #1a1408;
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
      #lead-close {
        position: absolute;
        top: 12px;
        right: 16px;
        background: none;
        border: none;
        color: #fff;
        font-size: 26px;
        line-height: 1;
        opacity: .6;
        cursor: pointer;
      }
      #lead-ok { font-size: 14px; color: #c8a96e; margin-top: 12px; }

      /* ── Info panel (POI tipo info) ── */
      #info-panel {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #info-panel.open { pointer-events: auto; }
      #info-card {
        width: min(420px, 92vw);
        transform: translateY(110%);
        transition: transform .3s cubic-bezier(0.87,0,0.13,1);
        margin-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        background: #14130f;
        color: #f3efe6;
        border-radius: 20px;
        padding: 0 0 20px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.12);
        position: relative;
      }
      #info-panel.open #info-card { transform: translateY(0); }
      #info-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
      #info-card h3 { font-size: 19px; padding: 16px 20px 0; font-family: 'DM Sans', sans-serif; }
      #info-card .info-area {
        display: inline-block;
        margin: 6px 20px 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .1em;
        color: #c8a96e;
        text-transform: uppercase;
        font-family: 'DM Sans', sans-serif;
      }
      #info-card ul { list-style: none; padding: 12px 20px 0; }
      #info-card li {
        font-size: 14px;
        opacity: .8;
        padding: 6px 0;
        border-top: 1px solid rgba(255,255,255,.08);
        font-family: 'DM Sans', sans-serif;
      }
      #info-card [data-close] {
        position: absolute;
        top: 10px;
        right: 14px;
        z-index: 2;
        background: rgba(0,0,0,.45);
        border: none;
        color: #fff;
        font-size: 24px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Mobile adjustments ── */
      @media (max-width: 600px) {
        #fp-footer {
          bottom: 100px;
          left: 20px;
          right: 20px;
          transform: none;
          border-radius: 14px;
          white-space: normal;
          text-align: center;
        }
        #cta-dock {
          bottom: max(110px, calc(env(safe-area-inset-bottom, 16px) + 100px));
          right: 12px;
        }
        #cta-whats span, #cta-visit span, #cta-tour span { display: none; }
        #cta-whats, #cta-visit, #cta-tour { padding: 14px; border-radius: 50%; }
      }
    </style>
  </head>
  <body>
    <a id="btn-back" href="fi-preview.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      <span>Voltar</span>
    </a>

    <div id="cursor"></div>
    <div id="ring"></div>
    <div id="noise"></div>

    <div id="stage">
      <video id="main-video" muted loop playsinline preload="auto"></video>
      <canvas id="seq-canvas"></canvas>
      <div id="poi-layer"></div>
    </div>

    <div id="scene-tag"></div>
    <div id="track"></div>

    <div id="loader"><span></span><span></span><span></span></div>

    <div id="debug-hud" hidden>
      <span id="debug-mode">DEBUG ON — clique para coordenadas</span>
      <span id="debug-coords">—</span>
    </div>

    <!-- Footer descritivo -->
    <div id="fp-footer">
      <p>Experiência imersiva de venda para empreendimentos na planta, o cliente passeia pelo apartamento antes da obra sair do chão.</p>
    </div>

    <!-- CTA flutuante -->
    <div id="cta-dock">
      <button id="cta-tour" onclick="startTour()">▶ <span>Tour</span></button>
      <button id="cta-visit"><span>Agendar visita</span></button>
      <a id="cta-whats" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
    </div>

    <!-- Modal de lead -->
    <div id="lead-modal" hidden>
      <div id="lead-card">
        <button id="lead-close" aria-label="Fechar">&times;</button>
        <h3>Agende sua visita</h3>
        <p>Deixe seus dados e um corretor entra em contato.</p>
        <form id="lead-form">
          <input name="nome"  type="text"  placeholder="Nome" required />
          <input name="email" type="email" placeholder="E-mail" required />
          <input name="fone"  type="tel"   placeholder="WhatsApp" required />
          <button type="submit">Quero agendar</button>
        </form>
        <p id="lead-ok" hidden>Recebido! Em breve entramos em contato. ✓</p>
      </div>
    </div>

    <script src="scenes-mp4.js"></script>
    <script src="script-mp4.js"></script>
  </body>
</html>
